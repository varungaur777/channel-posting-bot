# VPS / home server:  docker compose -f deploy/docker-compose.yml up -d --build
# Logs:               docker compose -f deploy/docker-compose.yml logs -f
# Do NOT run this while the GitHub Actions bot is enabled (only one copy may poll; the lease makes
# the second copy wait).
services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: channel-posting-bot
    env_file: ../.env
    environment:
      RUNTIME_PROFILE: persistent
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
