[project]
name = "channel-posting-bot"
version = "1.0.0"
description = "Telegram channel posting bot with an approval group and a scheduler"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:telegram.*", "ignore::DeprecationWarning:mongomock.*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
